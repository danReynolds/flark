[package]
name = "flark-engine"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = []
parser-internal = []
# Risk-first RFC 029 source-lifecycle proof. This remains unreachable from
# production until the progressive admission, parser, and product gates pass.
progressive-source-probe = []

[dependencies]
blake3 = "1.8"
crop = { git = "https://github.com/noib3/crop", rev = "d0234ce772eb34c7a3878d4ed57dc864da291cfb", features = ["utf16-metric"] }

[[test]]
name = "parser_scratch"
path = "tests/parser_scratch.rs"
required-features = ["parser-internal"]

[[test]]
name = "parser_source_authority"
path = "tests/parser_source_authority.rs"
required-features = ["parser-internal"]

[[test]]
name = "progressive_source"
path = "tests/progressive_source.rs"
required-features = ["progressive-source-probe"]

[[example]]
name = "progressive_source_probe"
path = "examples/progressive_source_probe.rs"
required-features = ["progressive-source-probe"]

[lints.rust]
dead_code = "deny"
unused_assignments = "deny"
unused_imports = "deny"
unused_variables = "deny"
unsafe_code = "forbid"
