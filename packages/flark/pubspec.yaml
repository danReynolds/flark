name: flark
description: "Live Markdown editing kernel: comrak's CommonMark and GFM parse through FFI or Wasm, with the projection, caret model and commands hosts render."
version: 0.5.0
repository: https://github.com/danReynolds/flark/tree/main/packages/flark
issue_tracker: https://github.com/danReynolds/flark/issues
topics:
  - markdown
  - editor
  - parser
  - commonmark

resolution: workspace

environment:
  sdk: ^3.10.4

dependencies:
  # Grapheme boundaries for caret movement and deletion; pinned like v4 did.
  characters: ^1.4.0
  code_assets: '>=1.0.0 <3.0.0'
  # The build hook checks downloaded parser libraries against pinned SHA-256s.
  crypto: ^3.0.7
  # The C allocator and its native free, which a parser's finalizer calls.
  ffi: ^2.1.0
  hooks: '>=1.0.0 <3.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

# Bundled by Flutter web builds at assets/packages/flark/lib/assets/wasm/.
# Native builds parse through the FFI library from the build hook, so they
# leave the module out. Fleury and other dart2js pages serve it themselves.
flutter:
  assets:
    - path: lib/assets/wasm/flark_parse.wasm
      platforms:
        - web
