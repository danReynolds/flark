name: flark
description: "Flark v5 kernel. Pure Dart: the render model, the parse transports (FFI and Wasm), and from M2 the projection and editor facade."
version: 0.5.0-dev.1
publish_to: none
homepage: https://github.com/danReynolds/flark
repository: https://github.com/danReynolds/flark

environment:
  sdk: ^3.10.4

dependencies:
  code_assets: ^1.0.0
  hooks: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

# Bundled by Flutter web builds at assets/packages/flark/lib/assets/wasm/;
# Fleury and other dart2js pages serve the file themselves.
flutter:
  assets:
    - lib/assets/wasm/flark_parse.wasm
