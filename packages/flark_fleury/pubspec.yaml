name: flark_fleury
description: "Live Markdown editor and viewer for Fleury terminal and browser apps, sharing the Flark kernel and CodeMirror code highlighting."
version: 0.5.0
repository: https://github.com/danReynolds/flark/tree/main/packages/flark_fleury
issue_tracker: https://github.com/danReynolds/flark/issues
topics:
  - markdown
  - editor
  - terminal
  - tui

resolution: workspace

environment:
  sdk: ^3.10.4

dependencies:
  characters: ^1.4.0
  http: ^1.6.0
  image: ^4.10.1
  web: ^1.1.1
  flark: ^0.5.0
  flark_codemirror: ^0.5.0
  fleury: ^0.1.0
  fleury_widgets: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
