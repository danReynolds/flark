name: flark_fleury
description: Fleury cell rendering and input for the Flark Markdown kernel.
version: 0.5.0-dev.1
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  characters: ^1.4.0
  flark:
    path: ../flark
  flark_tree_sitter:
    path: ../flark_tree_sitter
  fleury: ^0.1.0
  fleury_widgets:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: d37f5a56bcd164acb40ad7dd45ccd633b42cc0a3
      path: packages/fleury_widgets

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

# The unpublished companion packages declare hosted fleury constraints. Keep
# their shared core on the same reviewed revision until that release exists.
dependency_overrides:
  fleury:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: d37f5a56bcd164acb40ad7dd45ccd633b42cc0a3
      path: packages/fleury
