name: flark_fleury_example
description: A terminal and browser theme playground for Flark's Fleury host.
publish_to: none
environment:
  sdk: ^3.10.4
dependencies:
  flark:
    path: ../../flark
  flark_fleury:
    path: ..
  flark_tree_sitter:
    path: ../../flark_tree_sitter
  fleury: ^0.1.0
  fleury_web:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: ffb6d22d488a1979658578f4fc5634bb17b37b7f
      path: packages/fleury_web
  fleury_widgets:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: ffb6d22d488a1979658578f4fc5634bb17b37b7f
      path: packages/fleury_widgets
  web: ^1.1.1
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

# The unpublished companion packages declare hosted fleury constraints. Keep
# their shared core on the same reviewed revision until that release exists.
dependency_overrides:
  fleury:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: ffb6d22d488a1979658578f4fc5634bb17b37b7f
      path: packages/fleury
