[package]
name = "flark_tree_sitter"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Snippet-local syntax analysis and indentation for the flark_tree_sitter Dart package."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-highlight = "=0.27.0"
tree-sitter-dart = "=0.2.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-ruby = "=0.23.1"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
# 0.25.0's build script requires the removed tree-sitter 0.26 Wasm libc.
tree-sitter-css = "=0.23.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-html = "=0.23.2"
tree-sitter-xml = "=0.7.0"
tree-sitter-sequel = "=0.3.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
panic = "unwind"
