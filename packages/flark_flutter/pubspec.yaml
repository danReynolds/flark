name: flark_flutter
description: "Live Markdown editor and viewer for Flutter and Flutter web: type Markdown, see it rendered, and keep the source exactly as written."
version: 0.5.0
repository: https://github.com/danReynolds/flark/tree/main/packages/flark_flutter
issue_tracker: https://github.com/danReynolds/flark/issues
topics:
  - markdown
  - editor
  - rich-text
  - widget

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.4'
dependencies:
  characters: ^1.4.0
  web: ^1.1.1
  flark: ^0.5.0
  flark_codemirror: ^0.5.0
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  fonts:
    - family: FlarkMono
      fonts:
        - asset: lib/assets/fonts/RobotoMono-Regular.otf
  assets:
    - lib/assets/fonts/OFL.txt
