[package]
name = "flark-gate-a-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
comrak = { version = "=0.54.0", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
