[package]
name = "flark-canonical-range-gate"
version = "0.0.0"
edition = "2024"
publish = false
license = "BSD-2-Clause"

[dependencies]
comrak = { path = "../comrak_inline_fragment_gate/vendor/comrak", default-features = false }
