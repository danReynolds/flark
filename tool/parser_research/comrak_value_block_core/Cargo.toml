[package]
name = "flark-comrak-value-block-core"
version = "0.0.0"
edition = "2024"
publish = false
license = "BSD-2-Clause"

[dependencies]
comrak = { path = "../comrak_inline_fragment_gate/vendor/comrak", default-features = false }
flark-reference-label-service = { path = "../reference_label_service" }
generated_scanner_gate = { path = "../generated_scanner_gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flark-gate-a-harness = { path = "../gate_a_harness" }
flark-oversized-block-line-gate = { path = "../oversized_block_line_gate" }
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = true
lto = "thin"

[workspace]
