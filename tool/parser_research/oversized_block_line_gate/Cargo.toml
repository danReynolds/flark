[package]
name = "flark-oversized-block-line-gate"
version = "0.0.0"
edition = "2024"
publish = false
license = "BSD-2-Clause"

[dependencies]
comrak = { path = "../comrak_inline_fragment_gate/vendor/comrak", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
debug = true
lto = "thin"

[workspace]

