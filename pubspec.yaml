name: flark
description: A Dart-first live Markdown engine with native and WebAssembly parsing.
version: 0.1.1
homepage: https://danreynolds.github.io/flark/
repository: https://github.com/danReynolds/flark
issue_tracker: https://github.com/danReynolds/flark/issues
documentation: https://danreynolds.github.io/flark/
topics:
  - markdown
  - editor
  - dart
  - commonmark
  - gfm
screenshots:
  - description: Flark source editor, live-rendered editor, and preview surfaces.
    path: screenshots/flark_surfaces.png

environment:
  sdk: ^3.10.4

dependencies:
  # Extended-grapheme-cluster segmentation for editing (Backspace over flags,
  # ZWJ emoji, and NFD combining pairs). Pure Dart — safe for the headless core.
  characters: ^1.4.0
  ffi: ^2.1.4
  hooks: ^1.0.3
  code_assets: ^1.0.0
  html: ^0.15.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
  # Used only by the WASM freshness guard (tool/ + packaging test) to hash the
  # Rust bridge sources; not part of the shipped runtime.
  crypto: ^3.0.6
