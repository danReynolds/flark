name: flark_workspace
description: Repository qualification harness and pub workspace for the Flark packages.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.10.4

# One resolution for the packages, their examples and the homepage playground:
# members depend on each other by version and resolve to these checkouts.
workspace:
  - packages/flark
  - packages/flark_codemirror
  - packages/flark_flutter
  - packages/flark_flutter/example
  - packages/flark_fleury
  - packages/flark_fleury/example
  - website/playground

dependencies:
  crypto: ^3.0.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

# Fleury is not on pub.dev yet. flark_fleury declares the hosted constraints it
# will publish with; until that release exists, the workspace resolves them to
# the reviewed revision. Remove these once fleury and fleury_widgets are live.
dependency_overrides:
  fleury:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: 13367b0fb0deda3d3df44e5c03b20ab63d12738f
      path: packages/fleury
  fleury_widgets:
    git:
      url: https://github.com/danReynolds/fleury.git
      ref: 13367b0fb0deda3d3df44e5c03b20ab63d12738f
      path: packages/fleury_widgets
