[package]
name = "flark_parse"
version = "0.1.0"
edition = "2021"
publish = false
description = "Flark v5 parse crate: unmodified comrak plus a flat render-model extraction."
license = "MIT"

[lib]
name = "flark_parse"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
comrak = { version = "0.54", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "differential"
path = "src/bin/differential.rs"
required-features = ["tools"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["tools"]

[[bin]]
name = "model_hashes"
path = "src/bin/model_hashes.rs"
required-features = ["tools"]

[features]
tools = ["dep:serde", "dep:serde_json"]

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
