[package]
name = "flark_parse"
version = "0.1.0"
edition = "2021"
publish = false
description = "Flark v5 parse crate: unmodified comrak plus a flat render-model extraction."
license = "MIT"

[lib]
name = "flark_parse"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
comrak = { version = "0.54", default-features = false }

# Parsing allocates and frees heavily; mimalloc v2 parses 15-24% faster than
# the macOS system allocator. It serves only this library's Rust allocations
# (no malloc override). Wasm keeps its allocator. Keep the v2 line: the crate's
# default v3 segfaulted in mi_thread_init under `dart test`, where isolate
# groups load this library from many VM threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "differential"
path = "src/bin/differential.rs"
required-features = ["tools"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["tools"]

[[bin]]
name = "model_hashes"
path = "src/bin/model_hashes.rs"
required-features = ["tools"]

[features]
tools = ["dep:serde", "dep:serde_json"]

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
