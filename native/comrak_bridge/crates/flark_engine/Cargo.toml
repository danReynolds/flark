[package]
name = "flark-engine"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = []
parser-internal = []

[dependencies]
blake3 = "1.8"
crop = { git = "https://github.com/noib3/crop", rev = "d0234ce772eb34c7a3878d4ed57dc864da291cfb", features = ["utf16-metric"] }

[[test]]
name = "inline_projection"
path = "tests/inline_projection.rs"
required-features = ["parser-internal"]

[[test]]
name = "parser_pages"
path = "tests/parser_pages.rs"
required-features = ["parser-internal"]

[[test]]
name = "parser_scratch"
path = "tests/parser_scratch.rs"
required-features = ["parser-internal"]

[[test]]
name = "parser_source_authority"
path = "tests/parser_source_authority.rs"
required-features = ["parser-internal"]

[lints.rust]
unsafe_code = "forbid"
