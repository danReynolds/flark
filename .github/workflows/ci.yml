name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-crate:
    name: flark_parse · conformance, invariants, fuzz, transports
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust tests
        run: cargo test --release --manifest-path native/flark_parse/Cargo.toml
      - name: Native and wasm render models are byte-identical
        run: native/flark_parse/tool/verify_transports.sh

  dart-kernel:
    name: flark · dart tests through the build hook
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze
        working-directory: packages/flark
        run: dart pub get && dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark
        run: dart test
      - name: Consumer without Rust on PATH builds via a prebuilt
        run: packages/flark/tool/verify_prebuilt_consumer.sh
