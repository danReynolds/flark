name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The repository is a pub workspace with Flutter members, so every Dart job
# resolves it once, from the root, with the Flutter SDK's pub.

jobs:
  parse-crate:
    name: flark_parse · spec conformance, extraction, fuzz, transports
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$TOOLCHAIN"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generated schema files are current
        run: |
          python3 native/flark_parse/tool/gen_schema.py
          git diff --exit-code -- native/flark_parse/src/schema.rs native/flark_parse/SCHEMA.md packages/flark/lib/src/parse/schema.g.dart
      - name: Rust tests
        run: cargo test --release --locked --manifest-path native/flark_parse/Cargo.toml
      - name: Committed wasm and a fresh build both match native
        run: native/flark_parse/tool/verify_transports.sh --rebuild

  dart-kernel:
    name: flark · analyze, tests through the build hook, Rust-free consumers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark
        run: dart test
      - name: Embedded browser parser matches the Wasm asset
        run: python3 packages/flark/tool/embed_wasm.py --check
      - name: Consumer without Rust on PATH builds via a prebuilt
        run: packages/flark/tool/verify_prebuilt_consumer.sh
      - name: Consumer without Rust on PATH downloads a verified library
        run: packages/flark/tool/verify_download_consumer.sh

  web-kernel:
    name: flark · dart2js and dart2wasm agree with the VM
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: A Wasm trap reaches Dart under both web compilers
        working-directory: packages/flark
        run: |
          dart test -p node test/wasm_backend_test.dart
          dart test -p node -c dart2wasm test/wasm_backend_test.dart
      # The VM runs the FFI parser and the web runs the bundled Wasm module, so
      # behavior that differs anywhere from the model to the commands shows up
      # as a sequence whose digests disagree. --contract also runs the matrix
      # and the corpus contract under both web compilers.
      - name: Command sequences behave the same on the web and the VM
        working-directory: packages/flark
        run: tool/web_differential.sh -n 1000 -j 2 --contract

  windows-kernel:
    name: flark · Windows parser libraries and kernel tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Spec fixtures and source offsets depend on the committed line endings.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc
          rustup default "$TOOLCHAIN"
      - name: Build the parser libraries
        run: |
          # Symbols stripped, and the C runtime linked in, so the library also
          # loads where the Visual C++ redistributable is not installed.
          for TARGET in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            CARGO_PROFILE_RELEASE_STRIP=symbols RUSTFLAGS="-C target-feature=+crt-static" \
              cargo build --release --locked --lib --manifest-path native/flark_parse/Cargo.toml --target "$TARGET"
            mkdir -p "dist/$TARGET"
            cp "native/flark_parse/target/$TARGET/release/flark_parse.dll" "dist/$TARGET/"
          done
      - name: Check the libraries need no Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          foreach ($dll in Get-ChildItem dist -Recurse -Filter flark_parse.dll) {
            $dependents = & $dumpbin /nologo /dependents $dll.FullName
            $dependents | Write-Output
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $($dll.FullName)" }
            if ($dependents -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "$($dll.FullName) needs the Visual C++ runtime" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: flark_parse-windows
          path: dist/
          if-no-files-found: error
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The kernel tests load the x64 library uploaded above, through the
      # prebuilt_dir user-define, rather than building their own. (No arm64
      # runner executes the arm64 library.)
      - name: Point the build hook at the uploaded libraries
        run: |
          printf '\nhooks:\n  user_defines:\n    flark:\n      prebuilt_dir: dist\n' >> pubspec.yaml
      - name: Resolve the workspace
        run: flutter pub get
      - name: Test through the build hook
        working-directory: packages/flark
        run: dart test

  codemirror-port:
    name: flark_codemirror · analyze, CodeMirror reference and adapter tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The adapter tests edit through the kernel, whose build hook compiles
      # the parse crate.
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark_codemirror
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark_codemirror
        run: dart test

  flutter-host:
    name: flark_flutter · analyze, host and example tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark_flutter
        run: flutter analyze
      - name: Test
        working-directory: packages/flark_flutter
        run: flutter test
      - name: Example
        working-directory: packages/flark_flutter/example
        run: flutter analyze && flutter test
      - name: Example input through a browser's text field
        working-directory: packages/flark_flutter/example
        run: flutter test --platform chrome test/web_input_test.dart test/semantics_composition_web_test.dart

  fleury-host:
    name: flark_fleury · analyze, host and example tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark_fleury
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark_fleury
        run: dart test
      - name: Example
        working-directory: packages/flark_fleury/example
        run: dart analyze --fatal-infos && dart test
