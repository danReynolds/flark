name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The repository is a pub workspace with Flutter members, so every Dart job
# resolves it once, from the root, with the Flutter SDK's pub.

jobs:
  parse-crate:
    name: flark_parse · spec conformance, extraction, fuzz, transports
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$TOOLCHAIN"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generated schema files are current
        run: |
          python3 native/flark_parse/tool/gen_schema.py
          git diff --exit-code -- native/flark_parse/src/schema.rs native/flark_parse/SCHEMA.md packages/flark/lib/src/parse/schema.g.dart
      - name: Rust tests
        run: cargo test --release --locked --manifest-path native/flark_parse/Cargo.toml
      - name: Committed wasm and a fresh build both match native
        run: native/flark_parse/tool/verify_transports.sh --rebuild

  dart-kernel:
    name: flark · analyze, tests through the build hook, Rust-free consumers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark
        run: dart test
      - name: Embedded browser parser matches the Wasm asset
        run: python3 packages/flark/tool/embed_wasm.py --check
      - name: Consumer without Rust on PATH builds via a prebuilt
        run: packages/flark/tool/verify_prebuilt_consumer.sh
      - name: Consumer without Rust on PATH downloads a verified library
        run: packages/flark/tool/verify_download_consumer.sh

  windows-kernel:
    name: flark · Windows parser libraries and kernel tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Spec fixtures and source offsets depend on the committed line endings.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc
          rustup default "$TOOLCHAIN"
      - name: Build the parser libraries
        run: |
          for TARGET in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            CARGO_PROFILE_RELEASE_STRIP=symbols cargo build --release --locked --lib --manifest-path native/flark_parse/Cargo.toml --target "$TARGET"
            mkdir -p "dist/$TARGET"
            cp "native/flark_parse/target/$TARGET/release/flark_parse.dll" "dist/$TARGET/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: flark_parse-windows
          path: dist/
          if-no-files-found: error
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Test through the build hook
        working-directory: packages/flark
        run: dart test

  codemirror-port:
    name: flark_codemirror · analyze, CodeMirror reference and adapter tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The adapter tests edit through the kernel, whose build hook compiles
      # the parse crate.
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark_codemirror
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark_codemirror
        run: dart test

  flutter-host:
    name: flark_flutter · analyze, host and example tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark_flutter
        run: flutter analyze
      - name: Test
        working-directory: packages/flark_flutter
        run: flutter test
      - name: Example
        working-directory: packages/flark_flutter/example
        run: flutter analyze && flutter test

  fleury-host:
    name: flark_fleury · analyze, host and example tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: |
          TOOLCHAIN="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flark_fleury
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/flark_fleury
        run: dart test
      - name: Example
        working-directory: packages/flark_fleury/example
        run: dart analyze --fatal-infos && dart test
